<section>
  <h2>{{ goal.title }}</h2>
  <p>{{ goal.description }}</p>
  @if (goal.url; as url) {
    <a [href]="url" target="_blank" rel="noopener noreferrer">Learning Resource</a>
  }
  <button type="button" (click)="onLearned()">Learned It!</button>
  <button type="button" (click)="onNeedsPractice()">Let's Practice More</button>
</section>
